<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiếp tục</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#172b50 0%,#091426 45%,#050b15 100%);
    color:#fff;
}

.card{
    width:92%;
    max-width:430px;
    padding:38px 30px;
    text-align:center;
    background:rgba(18,35,63,.96);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.icon{
    width:68px;
    height:68px;
    margin:0 auto 22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    background:linear-gradient(135deg,#4169ff,#794cff);
    box-shadow:0 8px 25px rgba(65,105,255,.35);
}

h1{
    font-size:28px;
    line-height:1.25;
    margin-bottom:12px;
}

.desc{
    color:#aebbd0;
    font-size:15px;
    line-height:1.6;
    margin-bottom:28px;
}

button{
    width:100%;
    border:0;
    padding:17px;
    border-radius:14px;
    font-size:19px;
    font-weight:700;
    color:white;
    cursor:pointer;
    background:linear-gradient(90deg,#3264ff,#6b4cff);
    box-shadow:0 10px 25px rgba(60,90,255,.35);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.small{
    margin-top:20px;
    color:#71819a;
    font-size:12px;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">➜</div>

    <h1>BẠN ĐANG VÀO CÂY GỐC CỦA KIỂM CÀ MAU</h1>

    <div class="desc">
        Nhấn tiếp tục để truy cập nội dung.
    </div>

    <button onclick="goWebsite()">
        TIẾP TỤC
    </button>

    <div class="small">
        © 2026
    </div>

</div>

<script>
function goWebsite(){
    window.location.href = "https://kiem1.com/";
}
</script>

</body>
</html>
